<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIGFT Catalog Optimizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        charcoal: '#1a1a1a',
                        zigftGreen: '#39ff14', // Aksen Hijau Neon
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-charcoal text-gray-200 min-h-screen flex items-center justify-center p-4 font-sans">
    
    <div class="bg-black/50 border border-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md text-center">
        <h1 class="text-3xl font-bold mb-2">ZIGFT<span class="text-zigftGreen">.</span></h1>
        <p class="text-gray-400 text-sm mb-6">WhatsApp Catalog Image Optimizer (HD 1:1 Bypass)</p>
        
        <!-- Upload Section -->
        <div class="mb-6 relative">
            <input type="file" id="uploadInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
            <div class="border-2 border-dashed border-gray-700 hover:border-zigftGreen transition-colors rounded-lg py-12 px-4 flex flex-col items-center justify-center bg-gray-900/50">
                <svg class="w-10 h-10 text-gray-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                <span class="text-sm font-medium text-gray-400">Pilih gambar mockup (PNG/JPG)</span>
            </div>
        </div>

        <!-- Preview Canvas (Hidden by default, used for processing) -->
        <canvas id="canvas" width="1080" height="1080" class="hidden"></canvas>
        
        <!-- Status & Download -->
        <div id="statusArea" class="hidden">
            <p class="text-zigftGreen text-sm font-semibold mb-4">[-] Optimasi Algoritma Selesai!</p>
            <a id="downloadBtn" href="#" download="ZIGFT_HD_Catalog.jpg" class="block w-full bg-zigftGreen text-black font-bold py-3 rounded-lg hover:bg-green-400 transition-all shadow-[0_0_15px_rgba(57,255,20,0.3)]">
                Download HD Image (1080x1080)
            </a>
        </div>
    </div>

    <script>
        const uploadInput = document.getElementById('uploadInput');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusArea = document.getElementById('statusArea');
        const downloadBtn = document.getElementById('downloadBtn');

        uploadInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // Logic Hitungan Crop Tengah 1:1
                    const size = Math.min(img.width, img.height);
                    const sx = (img.width - size) / 2;
                    const sy = (img.height - size) / 2;

                    // Bersihkan kanvas & beri background hitam (menghindari transparansi PNG error)
                    ctx.fillStyle = "#000000";
                    ctx.fillRect(0, 0, 1080, 1080);

                    // Gambar hasil potongan (crop) ke resolusi 1080x1080
                    ctx.drawImage(img, sx, sy, size, size, 0, 0, 1080, 1080);

                    // Export gambar jadi JPEG kualitas 85% untuk trik Bypass WA
                    const hdUrl = canvas.toDataURL('image/jpeg', 0.85);
                    
                    // Tampilkan tombol download
                    downloadBtn.href = hdUrl;
                    statusArea.classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
